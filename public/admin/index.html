<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>管理画面｜クリスフードサービス</title>
    <!-- 手動初期化: ログイン(OAuth)の接続先を「いま開いているドメイン」にする。
         chrisbakery.jp でも chris-food-site.pages.dev でも、同じドメインでログインできる。 -->
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'yk0912/chris-food-site',
            branch: 'main',
            base_url: location.origin,
            auth_endpoint: 'api/auth',
          },
        },
      });
    </script>
  </body>
</html>
